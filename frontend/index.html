<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGC CRM Platform</title>

  <!-- Preconnect to Google Fonts CDN early -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Non-blocking stylesheet (display=optional → zero FOUT/CLS, no layout shift) -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=optional"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=optional">
  </noscript>
</head>

<body
  class="bg-[#F7F9F6] text-[#27332B] font-['Manrope'] font-sans antialiased selection:bg-[#DCE9DE] selection:text-[#2F4F3A]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
